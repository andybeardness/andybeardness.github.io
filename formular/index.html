<style>
  :root {
    --bg: #f2f2f7;

    --muted: #6c6c70;
    --separator: #e5e5ea;
    --accent: #5856d6;
    --accent-tint: #eeedfb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #ffffff;
      --muted: #aeaeb2;
      --separator: #2c2c2e;
      --accent: #7d7aff;
      --accent-tint: #1f1e3d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 20px 56px; }

  .topbar {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 8px 0 0;
  }
  .lang-select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--surface);
    color: var(--text);
    border: 0.5px solid var(--separator);
    border-radius: 10px;
    padding: 8px 32px 8px 12px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  header { text-align: center; padding: 12px 0 28px; }

    background: var(--accent);

    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(88, 86, 214, 0.25);
  }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.4px; }
  .tagline { color: var(--muted); margin: 0; font-size: 16px; }

  section {
    background: var(--surface);
    border-radius: 14px;
    padding: 8px 16px;
    margin-top: 6px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    font-weight: 600;
    margin: 22px 4px 8px;
    padding-left: 4px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 4px;
    border-bottom: 0.5px solid var(--separator);
    text-decoration: none;
    color: var(--text);
  }
  .row:last-child { border-bottom: 0; }
  .row .icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--accent-tint);
    color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-size: 16px; font-weight: 500; }
  .row .value { font-size: 14px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .row .chev { color: var(--muted); font-size: 18px; }

  .about-text { margin: 8px 4px; font-size: 15px; color: var(--text); }

  details {
    padding: 14px 4px;
    border-bottom: 0.5px solid var(--separator);
  }
  details:last-child { border-bottom: 0; }
  summary {
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "+";
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
  }
  details[open] summary::after { content: "−"; }
  .answer { color: var(--muted); font-size: 15px; padding-top: 10px; }
  .answer a { color: var(--accent); text-decoration: none; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 32px;
  }
  footer p { margin: 4px 0; }
</style>

const SUPPORTED = Object.keys(I18N);

function pickLang() {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("lang");
  if (fromUrl && SUPPORTED.includes(fromUrl)) return fromUrl;
  const saved = localStorage.getItem("formular_support_lang");
  if (saved && SUPPORTED.includes(saved)) return saved;
  const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  for (const l of langs) {
    const short = (l || "").slice(0, 2).toLowerCase();
    if (SUPPORTED.includes(short)) return short;
  }
  return "en";
}

function apply(lang) {
  const dict = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.title = dict.title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  const faqRoot = document.getElementById("faq");
  faqRoot.innerHTML = "";
  for (const [q, a] of dict.faq) {
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = q;
    const div = document.createElement("div");
    div.className = "answer";
    div.innerHTML = a;
    d.appendChild(s);
    d.appendChild(div);
    faqRoot.appendChild(d);
  }
  const subject = encodeURIComponent(dict.email_subject);
  document.getElementById("emailRow").href = "mailto:beardness.andy.dev@gmail.com?subject=" + subject;
  document.getElementById("langSelect").value = lang;
}

const initial = pickLang();
apply(initial);

document.getElementById("langSelect").addEventListener("change", e => {
  const lang = e.target.value;
  localStorage.setItem("formular_support_lang", lang);
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  apply(lang);
});
