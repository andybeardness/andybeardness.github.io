const SUPPORTED = Object.keys(I18N);

function pickLang() {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("lang");
  if (fromUrl && SUPPORTED.includes(fromUrl)) return fromUrl;
  const saved = localStorage.getItem("formular_support_lang");
  if (saved && SUPPORTED.includes(saved)) return saved;
  const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  for (const l of langs) {
    const short = (l || "").slice(0, 2).toLowerCase();
    if (SUPPORTED.includes(short)) return short;
  }
  return "en";
}

function apply(lang) {
  const dict = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.title = dict.title;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (dict[key] !== undefined) el.textContent = dict[key];
  });

  const metaRoot = document.getElementById("metaList");
  metaRoot.innerHTML = "";
  for (const [k, v] of dict.meta) {
    const row = document.createElement("div");
    row.className = "meta-row";
    const kEl = document.createElement("span");
    kEl.className = "k";
    kEl.textContent = k;
    const vEl = document.createElement("span");
    vEl.className = "v";
    vEl.textContent = v;
    row.appendChild(kEl);
    row.appendChild(vEl);
    metaRoot.appendChild(row);
  }

  const sectionsRoot = document.getElementById("sections");
  sectionsRoot.innerHTML = "";
  for (const [t, body] of dict.sections) {
    const art = document.createElement("article");
    const h = document.createElement("h3");
    h.textContent = t;
    const wrap = document.createElement("div");
    wrap.innerHTML = body;
    art.appendChild(h);
    art.appendChild(wrap);
    sectionsRoot.appendChild(art);
  }

  const subject = encodeURIComponent(dict.email_subject);
  document.getElementById("emailRow").href = "mailto:beardness.andy.dev@gmail.com?subject=" + subject;
  document.getElementById("langSelect").value = lang;
}

const initial = pickLang();
apply(initial);

document.getElementById("langSelect").addEventListener("change", e => {
  const lang = e.target.value;
  localStorage.setItem("formular_support_lang", lang);
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  apply(lang);
});
