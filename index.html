<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Beardness — Projects</title>
    <style>
        :root {
            --bg: #0f1115;
            --fg: #e7eaf0;
            --muted: #8b93a7;
            --card: #171a21;
            --border: #242833;
            --accent: #7aa2f7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 24px;
            flex: 1;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--muted);
            margin: 0 0 40px;
        }
        .projects {
            display: grid;
            gap: 16px;
        }
        .project {
            display: block;
            padding: 20px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s, transform 0.15s;
        }
        .project:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .project h2 {
            margin: 0 0 4px;
            font-size: 1.15rem;
        }
        .project p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
        footer {
            color: var(--muted);
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
        footer a {
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>Andy Beardness</h1>
        <p class="subtitle">Independent developer. Mobile & web projects.</p>

        <div class="projects">
            <a class="project" href="/korobochka/">
                <h2>Korobochka</h2>
                <p>Support & privacy policy</p>
            </a>
            <a class="project" href="/formular/">
                <h2>Formular</h2>
                <p>Support & privacy policy</p>
            </a>
            <a class="project" href="/mathix/">
                <h2>Mathix</h2>
                <p>Support & privacy policy</p>
            </a>
        </div>
    </main>
    <footer>
        <a href="mailto:beardness.andy.dev@gmail.com">beardness.andy.dev@gmail.com</a>
    </footer>
</body>
</html>
