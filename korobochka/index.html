<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korobochka — Support</title>
    <style>
        :root {
            --bg: #0f1115;
            --fg: #e7eaf0;
            --muted: #8b93a7;
            --card: #171a21;
            --border: #242833;
            --accent: #7aa2f7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px;
            flex: 1;
            width: 100%;
        }
        nav {
            margin-bottom: 32px;
            font-size: 0.9rem;
        }
        nav a {
            color: var(--muted);
            text-decoration: none;
        }
        nav a:hover {
            color: var(--accent);
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--muted);
            margin: 0 0 40px;
        }
        h2 {
            font-size: 1.15rem;
            margin: 32px 0 12px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
        }
        a.link {
            color: var(--accent);
            text-decoration: none;
        }
        a.link:hover {
            text-decoration: underline;
        }
        .links {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }
        footer {
            color: var(--muted);
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <nav><a href="/">← All projects</a></nav>

        <h1>Korobochka</h1>
        <p class="subtitle">Support page</p>

        <div class="card">
            <p>Have a question, issue, or feature request? Get in touch:</p>
            <div class="links">
                <div>📧 Email: <a class="link" href="mailto:beardness.andy.dev@gmail.com">beardness.andy.dev@gmail.com</a></div>
            </div>
        </div>

        <h2>Documents</h2>
        <div class="card">
            <div class="links">
                <div>🔒 <a class="link" href="/korobochka/privacy.html">Privacy Policy</a></div>
            </div>
        </div>
    </main>
    <footer>
        © <span id="year"></span> Andy Beardness
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
